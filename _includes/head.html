<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- assign ptitle = page.title | default: site.title -%}
{%- if page.url == "/" -%}
<title>{{ site.title }}</title>
{%- else -%}
<title>{{ ptitle }}, {{ site.title }}</title>
{%- endif %}
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preload" href="{{ '/assets/fonts/source-serif-4-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/ibm-plex-mono-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<meta property="og:type" content="{% if page.url == '/' %}profile{% else %}article{% endif %}">
<meta property="og:title" content="{{ ptitle }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:image" content="{{ site.og_image | absolute_url }}">
<meta property="og:image:width" content="{{ site.og_image_width }}">
<meta property="og:image:height" content="{{ site.og_image_height }}">
<meta property="og:image:alt" content="Portrait of {{ site.data.person.name }}">
<meta name="twitter:card" content="summary">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
{%- if page.url == "/" %}
{%- assign p = site.data.person %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "url": "{{ site.url }}/",
  "mainEntity": {
    "@type": "Person",
    "@id": "{{ site.url }}/#person",
    "name": "{{ p.name }}",
    "alternateName": ["Andreas Neitzel", "A. W. Neitzel"],
    "givenName": "Andreas",
    "familyName": "{{ p.family_name }}",
    "url": "{{ site.url }}/",
    "email": "mailto:{{ p.emails.personal }}",
    "jobTitle": "PhD candidate in astronomy",
    "identifier": {"@type": "PropertyValue", "propertyID": "ORCID", "value": "{{ p.identifiers.orcid }}"},
    "affiliation": [
      {"@type": "Organization", "name": "Instituto de Astrofísica e Ciências do Espaço"},
      {"@type": "CollegeOrUniversity", "name": "Universidade do Porto", "sameAs": "https://ror.org/043pwc612"}
    ],
    "knowsAbout": ["Galactic archaeology", "machine learning", "asteroseismology", "Gaia XP spectra"],
    "sameAs": [
      "https://orcid.org/{{ p.identifiers.orcid }}",
      "https://scholar.google.com/citations?user={{ p.identifiers.google_scholar }}",
      "https://github.com/{{ p.identifiers.github }}",
      "https://www.linkedin.com/in/{{ p.identifiers.linkedin }}",
      "https://openalex.org/A5076337148"
    ]
  }
}
</script>
{%- endif %}
