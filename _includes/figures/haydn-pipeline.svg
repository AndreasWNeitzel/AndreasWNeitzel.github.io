<svg class="bp-svg hy-svg" viewBox="0 0 1140 378" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hy-pt hy-pd"><title id="hy-pt">The HAYDNsim pipeline, in six stages</title><desc id="hy-pd">Archive data from Gaia DR3, HST and four catalogues; a bright-star threshold and membership selection; a King profile normalised to HST; a TRILEGAL population placed by inverse-CDF sampling; the HAYDN Noise Estimator run on Deucalion, which returns a noise-to-signal ratio and a stellar pollution ratio per star; and a seismic performance model. Open clusters and resolved fields skip the profile and population steps.</desc><text class="hy-head b-pop" style="--d:0.00s" x="20.0" y="30.0" text-anchor="start">HAYDN, AS PROPOSED</text><text class="hy-key b-pop" style="--d:0.10s" x="190.0" y="30.0" text-anchor="start">APERTURE</text><text class="hy-val b-pop" style="--d:0.15s" x="190.0" y="46.0" text-anchor="start">1.2 m</text><text class="hy-key b-pop" style="--d:0.10s" x="375.0" y="30.0" text-anchor="start">FIELD OF VIEW</text><text class="hy-val b-pop" style="--d:0.15s" x="375.0" y="46.0" text-anchor="start">1 degree</text><text class="hy-key b-pop" style="--d:0.10s" x="560.0" y="30.0" text-anchor="start">PLATE SCALE</text><text class="hy-val b-pop" style="--d:0.15s" x="560.0" y="46.0" text-anchor="start">0.5 arcsec per pixel</text><text class="hy-key b-pop" style="--d:0.10s" x="745.0" y="30.0" text-anchor="start">TARGETS</text><text class="hy-val b-pop" style="--d:0.15s" x="745.0" y="46.0" text-anchor="start">to G = 17</text><text class="hy-key b-pop" style="--d:0.10s" x="930.0" y="30.0" text-anchor="start">CANDIDATE CLUSTERS</text><text class="hy-val b-pop" style="--d:0.15s" x="930.0" y="46.0" text-anchor="start">27</text><path class="hy-rule b-draw" style="--d:0.10s;--dur:0.30s" pathLength="1" d="M20 60 H1120"/><path class="hy-box b-draw" style="--d:0.20s;--dur:0.40s" pathLength="1" d="M20 92 h172 v170 h-172 Z"/><text class="hy-title b-pop" style="--d:0.30s" x="30.0" y="114.0" text-anchor="start">1  ARCHIVE DATA</text><path class="hy-rule b-draw" style="--d:0.30s;--dur:0.20s" pathLength="1" d="M30 124 h152"/><text class="hy-line b-pop" style="--d:0.35s" x="30.0" y="144.0" text-anchor="start">Gaia DR3 cone, G to 18.5</text><text class="hy-line b-pop" style="--d:0.38s" x="30.0" y="160.0" text-anchor="start">HST ACS, cluster core</text><text class="hy-line b-pop" style="--d:0.41s" x="30.0" y="176.0" text-anchor="start">Harris 2010</text><text class="hy-line b-pop" style="--d:0.44s" x="30.0" y="192.0" text-anchor="start">Baumgardt+Hilker 2018</text><text class="hy-line b-pop" style="--d:0.47s" x="30.0" y="208.0" text-anchor="start">Hunt+Reffert 2024</text><text class="hy-line b-pop" style="--d:0.50s" x="30.0" y="224.0" text-anchor="start">Forbes+Bridges 2010</text><path class="hy-box b-draw" style="--d:0.32s;--dur:0.40s" pathLength="1" d="M206 92 h172 v170 h-172 Z"/><text class="hy-title b-pop" style="--d:0.42s" x="216.0" y="114.0" text-anchor="start">2  THRESHOLD, MEMBERS</text><path class="hy-rule b-draw" style="--d:0.42s;--dur:0.20s" pathLength="1" d="M216 124 h152"/><text class="hy-line b-pop" style="--d:0.47s" x="216.0" y="144.0" text-anchor="start">bright-star limit where</text><text class="hy-line b-pop" style="--d:0.50s" x="216.0" y="160.0" text-anchor="start">Gaia (outskirts) and</text><text class="hy-line b-pop" style="--d:0.53s" x="216.0" y="176.0" text-anchor="start">HST (core) are both</text><text class="hy-line b-pop" style="--d:0.56s" x="216.0" y="192.0" text-anchor="start">complete;</text><text class="hy-line b-pop" style="--d:0.59s" x="216.0" y="208.0" text-anchor="start">members selected</text><path class="hy-box b-draw" style="--d:0.44s;--dur:0.40s" pathLength="1" d="M392 92 h172 v170 h-172 Z"/><text class="hy-title b-pop" style="--d:0.54s" x="402.0" y="114.0" text-anchor="start">3  KING PROFILE</text><path class="hy-rule b-draw" style="--d:0.54s;--dur:0.20s" pathLength="1" d="M402 124 h152"/><text class="hy-line b-pop" style="--d:0.59s" x="402.0" y="144.0" text-anchor="start">normalised to HST in</text><text class="hy-line b-pop" style="--d:0.62s" x="402.0" y="160.0" text-anchor="start">the 50 to 100 arcsec</text><text class="hy-line b-pop" style="--d:0.65s" x="402.0" y="176.0" text-anchor="start">annulus; checked</text><text class="hy-line b-pop" style="--d:0.68s" x="402.0" y="192.0" text-anchor="start">against Gaia counts</text><path class="hy-box b-draw" style="--d:0.56s;--dur:0.40s" pathLength="1" d="M578 92 h172 v170 h-172 Z"/><text class="hy-title b-pop" style="--d:0.66s" x="588.0" y="114.0" text-anchor="start">4  TRILEGAL FIELD</text><path class="hy-rule b-draw" style="--d:0.66s;--dur:0.20s" pathLength="1" d="M588 124 h152"/><text class="hy-line b-pop" style="--d:0.71s" x="588.0" y="144.0" text-anchor="start">mass-calibrated to the</text><text class="hy-line b-pop" style="--d:0.74s" x="588.0" y="160.0" text-anchor="start">present-day mass and</text><text class="hy-line b-pop" style="--d:0.77s" x="588.0" y="176.0" text-anchor="start">bright-star counts;</text><text class="hy-line b-pop" style="--d:0.80s" x="588.0" y="192.0" text-anchor="start">placed on the sky by</text><text class="hy-line b-pop" style="--d:0.83s" x="588.0" y="208.0" text-anchor="start">inverse-CDF sampling</text><path class="hy-box b-draw" style="--d:0.68s;--dur:0.40s" pathLength="1" d="M764 92 h172 v170 h-172 Z"/><text class="hy-title b-pop" style="--d:0.78s" x="774.0" y="114.0" text-anchor="start">5  HNE ON DEUCALION</text><path class="hy-rule b-draw" style="--d:0.78s;--dur:0.20s" pathLength="1" d="M774 124 h152"/><text class="hy-line b-pop" style="--d:0.83s" x="774.0" y="144.0" text-anchor="start">HAYDN Noise Estimator</text><text class="hy-line b-pop" style="--d:0.86s" x="774.0" y="160.0" text-anchor="start">(R. Samadi): per-star</text><text class="hy-line b-pop" style="--d:0.89s" x="774.0" y="176.0" text-anchor="start">NSR, with the light of</text><text class="hy-line b-pop" style="--d:0.92s" x="774.0" y="192.0" text-anchor="start">every neighbour,</text><text class="hy-line b-pop" style="--d:0.95s" x="774.0" y="208.0" text-anchor="start">and the SPR</text><path class="hy-box b-draw" style="--d:0.80s;--dur:0.40s" pathLength="1" d="M950 92 h172 v170 h-172 Z"/><text class="hy-title b-pop" style="--d:0.90s" x="960.0" y="114.0" text-anchor="start">6  SEISMIC MODEL</text><path class="hy-rule b-draw" style="--d:0.90s;--dur:0.20s" pathLength="1" d="M960 124 h152"/><text class="hy-line b-pop" style="--d:0.95s" x="960.0" y="144.0" text-anchor="start">model of Mosser et al.</text><text class="hy-line b-pop" style="--d:0.98s" x="960.0" y="160.0" text-anchor="start">2019: per-star noise</text><text class="hy-line b-pop" style="--d:1.01s" x="960.0" y="176.0" text-anchor="start">becomes detectability</text><text class="hy-line b-pop" style="--d:1.04s" x="960.0" y="192.0" text-anchor="start">(no numbers here)</text><path class="hy-inner b-draw" style="--d:0.90s;--dur:0.30s" pathLength="1" d="M774 218 h152 v36 h-152 Z"/><text class="hy-key b-pop" style="--d:1.00s" x="780.0" y="233.0" text-anchor="start">INSIDE HNE: PSF,</text><text class="hy-line b-pop" style="--d:1.00s" x="780.0" y="247.0" text-anchor="start">aperture, crowding</text><g class="b-pop" style="--d:0.35s"><path class="ray flowray hy-thread" d="M192 177.0 C197 170.0, 201 184.0, 206 177.0"/></g><g class="b-pop" style="--d:0.35s"><rect class="hy-node" x="189.0" y="174.0" width="6.0" height="6.0"/></g><g class="b-pop" style="--d:0.40s"><rect class="hy-node" x="203.0" y="174.0" width="6.0" height="6.0"/></g><g class="b-pop" style="--d:0.47s"><path class="ray flowray hy-thread" d="M378 177.0 C383 170.0, 387 184.0, 392 177.0"/></g><g class="b-pop" style="--d:0.47s"><rect class="hy-node" x="375.0" y="174.0" width="6.0" height="6.0"/></g><g class="b-pop" style="--d:0.52s"><rect class="hy-node" x="389.0" y="174.0" width="6.0" height="6.0"/></g><g class="b-pop" style="--d:0.59s"><path class="ray flowray hy-thread" d="M564 177.0 C569 170.0, 573 184.0, 578 177.0"/></g><g class="b-pop" style="--d:0.59s"><rect class="hy-node" x="561.0" y="174.0" width="6.0" height="6.0"/></g><g class="b-pop" style="--d:0.64s"><rect class="hy-node" x="575.0" y="174.0" width="6.0" height="6.0"/></g><g class="b-pop" style="--d:0.71s"><path class="ray flowray hy-thread" d="M750 177.0 C755 170.0, 759 184.0, 764 177.0"/></g><g class="b-pop" style="--d:0.71s"><rect class="hy-node" x="747.0" y="174.0" width="6.0" height="6.0"/></g><g class="b-pop" style="--d:0.76s"><rect class="hy-node" x="761.0" y="174.0" width="6.0" height="6.0"/></g><g class="b-pop" style="--d:0.83s"><path class="ray flowray hy-thread" d="M936 177.0 C941 170.0, 945 184.0, 950 177.0"/></g><g class="b-pop" style="--d:0.83s"><rect class="hy-node" x="933.0" y="174.0" width="6.0" height="6.0"/></g><g class="b-pop" style="--d:0.88s"><rect class="hy-node" x="947.0" y="174.0" width="6.0" height="6.0"/></g><g class="b-pop" style="--d:1.00s"><path class="ray flowray hy-thread" d="M1122 177.0 C1130 177.0, 1130 177.0, 1136 177.0"/></g><g class="b-pop" style="--d:1.00s"><rect class="hy-node" x="1119.0" y="174.0" width="6.0" height="6.0"/></g><g class="b-pop" style="--d:1.05s"><path class="ray flowray hy-bypass" d="M292.0 262 C292.0 292, 312.0 302, 332.0 302 H810.0 C830.0 302, 850.0 292, 850.0 262"/></g><g class="b-pop" style="--d:1.05s"><rect class="hy-node" x="289.0" y="259.0" width="6.0" height="6.0"/></g><g class="b-pop" style="--d:1.10s"><rect class="hy-node" x="847.0" y="259.0" width="6.0" height="6.0"/></g><text class="hy-line b-pop" style="--d:1.15s" x="571.0" y="320.0" text-anchor="middle">open clusters and resolved fields skip the profile and the population steps</text><text class="hy-head b-pop" style="--d:0.20s" x="20.0" y="368.0" text-anchor="start">SCHEMATIC, AFTER THE POSTER FLOWCHART AND THE DFA WEEK 2026 TALK. OUTLINE MEANS SCHEMATIC.</text></svg>
