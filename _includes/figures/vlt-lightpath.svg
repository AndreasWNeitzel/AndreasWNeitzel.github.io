<svg class="bp-svg vlt-svg" viewBox="0 0 800 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lp-t lp-d">
  <title id="lp-t">Light path from a VLT Unit Telescope to ESPRESSO, schematic</title>
  <desc id="lp-d">Starlight reflects off the 8.2 m primary mirror to the secondary and the tertiary, travels down the coudé train to the Combined-Coudé Laboratory, enters ESPRESSO through fibres, and is spread by an échelle grating and a cross-disperser onto the detector as a two-dimensional spectrum, which is read out and passed on as data.</desc>
  <!-- construction: ground, pier, fork, axis, truss (drawn first) -->
  <path class="bp-thin b-draw" style="--d:0s;--dur:.17s" pathLength="1" d="M20 372 L780 372"/>
  <path class="bp b-draw" style="--d:.03s;--dur:.17s" pathLength="1" d="M112 372 L112 330 L308 330 L308 372"/>
  <path class="bp-thin b-pop" style="--d:.17s" d="M120 372 l8 -8 M136 372 l8 -8 M152 372 l8 -8 M168 372 l8 -8 M184 372 l8 -8 M200 372 l8 -8 M216 372 l8 -8 M232 372 l8 -8 M248 372 l8 -8 M264 372 l8 -8 M280 372 l8 -8 M296 372 l8 -8"/>
  <path class="bp b-draw" style="--d:.06s;--dur:.17s" pathLength="1" d="M138 330 L138 236 M282 330 L282 236"/>
  <circle class="bp b-pop" style="--d:.2s" cx="210" cy="236" r="5"/>
  <path class="axis b-pop" style="--d:.12s" d="M110 236 L310 236"/>
  <text class="bp-tick b-pop" style="--d:.2s" x="314" y="240">altitude axis</text>
  <path class="bp-thin b-draw" style="--d:.09s;--dur:.17s" pathLength="1" d="M132 288 L190 60 M288 288 L230 60 M132 288 L230 60 M288 288 L190 60"/>
  <path class="bp b-draw" style="--d:.12s;--dur:.17s" pathLength="1" d="M184 60 L236 60"/>
  <!-- optics of the telescope (objects, in one step) -->
  <path class="bp mirror b-pop" style="--d:.2s" d="M128 292 Q210 314 292 292"/>
  <path class="bp-thin b-pop" style="--d:.2s" d="M128 304 L128 318 M292 304 L292 318 M128 312 L292 312"/>
  <text class="bp-tick b-pop" style="--d:.2s" x="176" y="328">8.2 m</text>
  <text class="bp-label2 b-pop" style="--d:.2s" x="298" y="283">M1 primary</text>
  <path class="bp mirror b-pop" style="--d:.22s" d="M196 66 Q210 60 224 66"/>
  <text class="bp-label2 b-pop" style="--d:.22s" x="280" y="50">M2 secondary</text>
  <path class="bp mirror b-pop" style="--d:.24s" d="M202 228 L218 244"/>
  <text class="bp-label2 b-pop" style="--d:.24s" x="164" y="222">M3</text>
  <path class="bp mirror b-pop" style="--d:.26s" d="M276 230 L288 242 M276 346 L288 358 M364 346 L376 358 M364 294 L376 306"/>
  <text class="bp-label2 b-pop" style="--d:.26s" x="300" y="392">coudé train, under the platform</text>
  <text class="bp-tick b-pop" style="--d:.26s" x="300" y="406">to the Combined-Coudé Laboratory</text>
  <!-- the light: starlight down to M1, up to M2, down to M3, along the coudé train -->
  <text class="bp-label2 b-pop" style="--d:.3s" x="120" y="16">starlight</text>
  <path class="ray b-draw" style="--d:.3s;--dur:.32s" pathLength="1" d="M150 20 L150 296"/>
  <path class="ray b-draw" style="--d:.3s;--dur:.32s" pathLength="1" d="M270 20 L270 296"/>
  <path class="eo-head b-pop" style="--d:.6s" d="M146.4 287 L150 293 L153.6 287 M266.4 287 L270 293 L273.6 287"/>
  <path class="ray b-draw" style="--d:.62s;--dur:.18s" pathLength="1" d="M150 296 L204 66"/>
  <path class="ray b-draw" style="--d:.62s;--dur:.18s" pathLength="1" d="M270 296 L216 66"/>
  <path class="ray b-draw" style="--d:.8s;--dur:.15s" pathLength="1" d="M204 66 L210 230"/>
  <path class="ray b-draw" style="--d:.8s;--dur:.15s" pathLength="1" d="M216 66 L210 230"/>
  <g class="b-pop" style="--d:.95s"><path class="ray flowray" d="M212 236 L282 236 L282 352 L370 352 L370 300 L460 300"/></g>
  <path class="eo-head b-pop" style="--d:1.33s" d="M452 296.4 L458 300 L452 303.6"/>
  <!-- ESPRESSO: vessel and optics appear before the light arrives -->
  <rect class="bp lab b-pop" style="--d:1s" x="460" y="120" width="320" height="236" rx="4" stroke-dasharray="5 4"/>
  <text class="bp-label2 b-pop" style="--d:1s" x="472" y="140">ESPRESSO</text>
  <text class="bp-tick b-pop" style="--d:1s" x="472" y="154">échelle spectrograph, vacuum vessel</text>
  <path class="bp b-draw" style="--d:1.35s;--dur:.1s" pathLength="1" d="M460 300 C490 300 496 260 510 252"/>
  <circle class="bp-fill b-pop" style="--d:1.44s" cx="512" cy="251" r="2.5"/>
  <text class="bp-tick b-pop" style="--d:1.05s" x="472" y="318">front end and fibres</text>
  <path class="bp mirror b-pop" style="--d:1.1s" d="M560 214 Q568 251 560 288"/>
  <text class="bp-tick b-pop" style="--d:1.1s" x="540" y="300">collimator</text>
  <path class="ray b-draw" style="--d:1.45s;--dur:.1s" pathLength="1" d="M512 251 L560 220 M512 251 L560 282"/>
  <g class="b-pop" style="--d:1.15s">
    <rect class="bp" x="636" y="182" width="16" height="72" transform="rotate(-12 644 218)"/>
    <path class="bp-thin" d="M638 190 l12 -4 M638 202 l12 -4 M638 214 l12 -4 M638 226 l12 -4 M638 238 l12 -4" transform="rotate(-12 644 218)"/>
    <text class="bp-tick" x="612" y="176">échelle grating</text>
  </g>
  <path class="ray b-draw" style="--d:1.55s;--dur:.1s" pathLength="1" d="M564 230 L636 196 M564 272 L636 238"/>
  <path class="bp b-pop" style="--d:1.2s" d="M690 244 L702 296 L678 296 Z"/>
  <text class="bp-tick b-pop" style="--d:1.2s" x="652" y="314">cross-disperser</text>
  <path class="ray warmray b-draw" style="--d:1.65s;--dur:.1s" pathLength="1" d="M640 220 L690 252 M642 232 L690 268 M644 244 L690 284"/>
  <rect class="bp b-pop" style="--d:1.25s" x="722" y="232" width="44" height="72" rx="2"/>
  <text class="bp-tick b-pop" style="--d:1.25s" x="722" y="225">detector</text>
  <path class="ray warmray b-draw" style="--d:1.75s;--dur:.05s" pathLength="1" d="M700 270 L720 268"/>
  <path class="order b-pop" style="--d:1.8s" d="M726 240 q18 -4 36 2 M726 250 q18 -4 36 2 M726 260 q18 -4 36 2 M726 270 q18 -4 36 2 M726 280 q18 -4 36 2 M726 290 q18 -4 36 2"/>
  <text class="bp-tick b-pop" style="--d:1.3s" x="472" y="342">resolving power ≈ 138,000</text>
  <!-- generated: data thread (figures/observing/build_espresso_output.py) -->
  <rect class="eo-node b-pop eo-seam" style="--d:1.80s" x="763.0" y="265.0" width="6" height="6"/>
  <g class="b-pop eo-seam" style="--d:1.80s"><path class="ray flowray eo-link eo-seam" style="animation-delay:-1.100s" d="M766.0 268.0 C782.2 268.0, 791.5 205.1, 800.0 158.0"/></g>
  <g class="b-pop eo-seam" style="--d:2.65s"><path class="ray flowray eo-link eo-seam" style="animation-delay:-0.469s" d="M800.0 418.0 C600.0 430.0, 240.0 410.0, 40.0 422.0 C24.0 423.0, 18.0 428.0, 18.0 436.0"/></g>
  <!-- /generated -->
</svg>
