<svg class="bp-svg eo-svg eo-exposure" viewBox="0 0 420 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eo-x-t eo-x-d"><title id="eo-x-t">From one exposure to one radial velocity</title><desc id="eo-x-d">Each 25-second exposure gives an extracted spectrum; cross-correlating it gives a dip whose shift is the radial velocity, 27.0 km/s for GJ 570 A. One velocity has an average uncertainty of 46 cm/s, while the oscillations reach about 2.57 cm/s.</desc><g class="b-pop eo-seam" style="--d:1.80s"><path class="ray flowray eo-link eo-seam" style="animation-delay:-0.269s" d="M-0.0 158.0 C5.1 129.7, 10.0 107.0, 16.0 107.0"/></g><rect class="eo-node b-pop" style="--d:1.92s" x="13.0" y="104.0" width="6" height="6"/><rect class="eo-node b-pop" style="--d:2.20s" x="13.0" y="207.0" width="6" height="6"/><rect class="eo-node b-pop" style="--d:2.50s" x="13.0" y="297.0" width="6" height="6"/><g class="b-pop" style="--d:2.20s"><path class="ray flowray eo-link" style="animation-delay:-1.100s" d="M16.0 113.0 C4.0 140.0, 4.0 180.0, 16.0 204.0"/></g><g class="b-pop" style="--d:2.50s"><path class="ray flowray eo-link" style="animation-delay:-1.100s" d="M16.0 216.0 C4.0 244.0, 4.0 272.0, 16.0 294.0"/></g><g class="b-pop eo-seam" style="--d:2.65s"><path class="ray flowray eo-link eo-seam" style="animation-delay:-1.100s" d="M16.0 306.0 C16.0 372.0, 12.0 418.0, 0.0 418.0"/></g><text class="eo-title b-pop" style="--d:1.86s" x="36.0" y="28.0">From one 25-second exposure to one velocity</text><text class="eo-label b-pop" style="--d:1.92s" x="36.0" y="80.0">extracted spectrum</text><path class="bp b-draw" style="--d:1.95s;--dur:.25s" pathLength="1" d="M36 98 H64 l4 12 l4 -12 H96 l3 6 l3 -6 H128 l4 18 l4 -18 H160 l3 5 l3 -5 H190 l4 10 l4 -10 H222 l3 7 l3 -7 H252 l4 16 l4 -16 H284 l3 6 l3 -6 H316 l4 11 l4 -11 H348 l3 5 l3 -5 H400"/><text class="eo-label b-pop" style="--d:2.20s" x="36.0" y="176.0">cross-correlation</text><path class="bp-thin b-draw" style="--d:2.22s;--dur:.17s" pathLength="1" d="M36 232 H400 M188 186 V236"/><path class="bp b-draw" style="--d:2.25s;--dur:.2s" pathLength="1" d="M36 192 C 200 192, 214 228, 246 228 C 278 228, 292 192, 400 192"/><path class="eo-mark b-pop" style="--d:2.4s" d="M246 184 V236"/><path class="eo-dim b-pop" style="--d:2.42s" d="M192 208 H242 M192 204 v8 M242 204 v8"/><text class="eo-num b-pop" style="--d:2.42s" x="217.0" y="202.0" text-anchor="middle">shift</text><text class="eo-value b-pop" style="--d:2.42s" x="36.0" y="254.0">27.0 km/s</text><text class="eo-label b-pop" style="--d:2.52s" x="36.0" y="304.0">one velocity</text><text class="eo-value b-pop" style="--d:2.55s" x="36.0" y="324.0">27.0006 km/s ± 77 cm/s</text><text class="eo-note b-pop" style="--d:2.58s" x="36.0" y="346.0">uncertainty 46 cm/s</text><text class="eo-note b-pop" style="--d:2.60s" x="36.0" y="362.0">oscillation 2.57 cm/s</text></svg>
