<figure class="mw" id="mw-demo" data-mw data-src="{{ '/assets/data/mw/giants.bin' | relative_url }}" data-n="160000">
<link rel="stylesheet" href="{{ '/assets/css/mw-demo.css' | relative_url }}">
<div class="mw-card">
<div class="mw-views">
<div class="mw-stage"><canvas tabindex="0" role="img" aria-label="Three-dimensional map of 160,000 Gaia red giants within five kiloparsecs of the Sun, coloured by metallicity, that can be orbited with the pointer or the arrow keys and zoomed with Ctrl and the scroll wheel or the plus and minus keys."></canvas>
<div class="mw-marks" aria-hidden="true"><span class="mw-mark mw-mark--sun" data-mark="sun" hidden><i></i>Sun</span><span class="mw-mark mw-mark--gc" data-mark="gc" hidden><i></i>Galactic centre</span><span class="mw-ring" data-mark="r5" hidden>5 kpc</span></div>
<span class="mw-tag">Drag to orbit, Ctrl + scroll to zoom</span>
<button type="button" class="btn btn--sm mw-play" aria-pressed="false">Play</button>
<p class="mw-load" aria-live="polite">Loading 160,000 stars</p></div>
<div class="mw-scale" aria-hidden="true"><span class="mw-scale-title" data-scale-title>[Fe/H]</span><span class="mw-scale-lab" data-scale-hi>&minus;0.4</span><span class="mw-scale-bar"></span><span class="mw-scale-lab" data-scale-lo>&minus;1.1</span></div>
</div>
<div class="mw-bar">
<span class="mw-group"><span class="mw-lab">View</span><span class="seg mw-seg" role="group" aria-label="Viewpoint" data-views><button type="button" data-view="sun" aria-pressed="false">From the Sun</button><button type="button" data-view="above" aria-pressed="false">Above the disc</button><button type="button" data-view="edge" aria-pressed="true">Edge-on</button></span></span>
<span class="mw-group"><span class="mw-lab">Colour</span><span class="seg mw-seg" role="group" aria-label="Colour by" data-colour><button type="button" data-mode="feh" aria-pressed="true">Metallicity</button><button type="button" data-mode="dist" aria-pressed="false">Distance</button></span></span>
<dl class="mw-read"><div><dt>Stars in view</dt><dd data-count>0 of 160,000</dd></div></dl>
</div>
</div>
<figcaption class="mw-cap">
<p>160,000 red giants from <i>Gaia</i> DR3 within five kiloparsecs of the Sun, with a ring every kiloparsec.</p>
<p class="credit">Data: <a href="https://doi.org/10.3847/1538-4365/acd53e">Andrae, Rix and Chandra 2023</a>, from <a href="https://doi.org/10.1051/0004-6361/202243940"><i>Gaia</i> Data Release 3</a>.</p>
</figcaption>
<noscript><p class="mw-noscript">The map needs JavaScript and WebGL; the caption describes what it shows.</p></noscript>
<script src="{{ '/assets/js/tokens.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/mw-demo.js' | relative_url }}" defer></script>
</figure>
