# Title-card photographs for the travel map. Licences, authors and titles were read from the
# Wikimedia Commons file pages (API extmetadata and page wikitext) on 2026-10-25; Flickr imports
# carry a passed Commons licence review. Each card is a derivative of the original: cropped to
# 16:9, resized to 1200 x 675 and saved as WebP (lluc.webp also has a 0.5 px blur to stay under
# 180 KB). Under CC BY-SA the derivative is shared under the same licence as its source.
# `credit` is the line to print next to the image.

vila-do-conde:
  file: vila-do-conde.webp
  title: "Vila do Conde, Portugal (43051541201).jpg"
  author: Pedro Silva
  licence: CC BY 2.0
  licence_url: https://creativecommons.org/licenses/by/2.0/
  source_url: https://commons.wikimedia.org/wiki/File:Vila_do_Conde,_Portugal_(43051541201).jpg
  credit: "Pedro Silva, Wikimedia Commons, CC BY 2.0"
  description: The Ave estuary at Vila do Conde, with a replica sixteenth-century nau, the marina and the Santa Clara monastery above the town.

