  credit: "ESO. Acknowledgement: ESO Imaging Survey"
  description: The globular cluster Messier 4 in Scorpius, imaged with the Wide Field Imager on the MPG/ESO 2.2-metre telescope at La Silla.

vlt-laser:
  file: vlt-laser.webp
  title: "The VLT's artificial star (potw1425a)"
  author: Gianluca Lombardi for ESO
