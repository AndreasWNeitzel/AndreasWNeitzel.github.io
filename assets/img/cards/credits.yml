# Title-card images for the home-page band. Licences and credit lines were read from each
# source page on 2026-10-25. Each card is a derivative of the original: cropped to 16:10 and
# resized to 1200 x 750 (gaia-sky.webp is the whole map fitted inside 1200 x 750 on its own
# near-black background instead), saved as WebP; messier-4.webp and milky-way.webp also have a
# light blur (0.5 and 0.6 px) to stay under 160 KB. No other edits.
# ESO requires its credit line in full, visible next to the image, with an active link online.
# Under CC BY-SA the derivative is shared under the same licence as its source.

gaia-sky:
  file: gaia-sky.webp
  title: "The colour of the sky from Gaia's Early Data Release 3"
  author: ESA/Gaia/DPAC
  licence: CC BY-SA 3.0 IGO
  licence_url: https://creativecommons.org/licenses/by-sa/3.0/igo/
  source_url: https://www.esa.int/ESA_Multimedia/Images/2020/12/The_colour_of_the_sky_from_Gaia_s_Early_Data_Release_3
  credit: "ESA/Gaia/DPAC; CC BY-SA 3.0 IGO. Acknowledgement: A. Moitinho."
  description: The whole sky in the brightness and colour of more than 1.8 billion stars measured by Gaia (EDR3, 2020).

kepler:
  file: kepler.webp
  title: "KSC-2009-1649"
  author: NASA/Troy Cryder
  licence: Public domain in the US (NASA content; the media usage guidelines extend permission to personal web pages)
  licence_url: https://www.nasa.gov/nasa-brand-center/images-and-media/
  source_url: https://images.nasa.gov/details/KSC-2009-1649
  credit: "NASA/Troy Cryder"
  description: The Kepler spacecraft suspended in the Astrotech processing facility in Florida in February 2009, weeks before launch.

messier-4:
