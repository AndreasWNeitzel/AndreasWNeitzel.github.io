- id: sw-2026-05-tellurion
  title: 'Tellurion: a laboratory of interactive physics simulations'
  tagline: Free website of interactive physics and astronomy simulations.
  kind: app
  role: sole-developer
  date: '2026-05-13'
  end_date: present
  identifiers:
    url: https://tellurion.dev/
    repo: https://github.com/AndreasWNeitzel/tellurion
  summary: Covers mechanics, electromagnetism, optics, quantum mechanics, relativity, statistical mechanics, fluid dynamics, condensed matter and astrophysics. Built during the PhD as a teaching resource.
  details:
  - Plain JavaScript modules without a framework, drawn in Canvas2D, SVG and WebGL2, on shared numerical engines with symplectic integrators and Markov chain Monte Carlo samplers.
  - Each simulation has invariant tests against thresholds in its specification, plus browser end-to-end and pixel-regression tests.
  - Optional course routes follow FCUP programmes. Public beta.
  tags:
  - education
  - javascript
  - simulation
  - webgl
  - open-source
  weight: 3
  audiences:
  - academic
  - industry-tech
  licence: MIT
  version: 0.1.2
