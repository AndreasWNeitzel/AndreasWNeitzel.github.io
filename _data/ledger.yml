- id: sw-2026-starfold
  title: Starfold
  kind: package
  role: sole-developer
  date: '2026-04-20'
  end_date: present
  people:
  - A. W. Neitzel
  identifiers:
    repo: https://github.com/AndreasWNeitzel/starfold
    url: https://andreaswneitzel.github.io/Starfold/
  summary: 'Python package that finds groups in a numeric table without labels, using UMAP, HDBSCAN and Optuna, and reports how far to trust them: recurrence across refits, named reliability flags and an optional Monte Carlo calibration test; extends Neitzel et al. 2025.'
  details:
  - Optuna searches UMAP and HDBSCAN settings with the library defaults as the first trial; each setting is scored without labels against a structureless copy of the table.
  - The selected setting is refit on 32 random subsets of 80 percent of the rows to measure how often each row and group recurs; unsupported claims come back as 17 named flags.
  - Optional calibration test against structureless copies of the table, costing up to 1,938 fits at the default settings.
  - GPU path through RAPIDS cuML with a CPU fallback; strict mypy typing; 294 tests; checksummed JSON and NumPy result files without pickles.
  - 'Benchmark reported openly: it matched or beat the library defaults on 8 of 10 tables but on only 2 of 4 held-out tables, and lost on COIL-20 and Isolet.'
  - Release 0.2.0 on 2026-10-19 replaced the earlier 0.0.1 code base with a new API.
  tags:
  - python
  - umap
  - hdbscan
  - optuna
  - unsupervised-learning
  - gpu
  - rapids
  - open-source
  weight: 5
  audiences:
  - academic
  - industry-ai
  - industry-tech
  - quant
  licence: MIT
  version: 0.2.0
  numbers:
    refits: 32
    flags: 17
    null_test_fits: 1,938
    subset_fraction: 80
    tests: 294
    benchmark_matched_or_beat: 8 of 10
    heldout_matched_or_beat: 2 of 4
    heldout_mean_recovery: 0.239 against 0.291 for the defaults
    src_lines: about 5,500
    test_lines: about 4,500
