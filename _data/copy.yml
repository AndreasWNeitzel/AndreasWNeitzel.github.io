about:
  description: "Andreas W. Neitzel is a fifth-year PhD candidate in astronomy at the University of Porto who applies deep learning and unsupervised methods to Gaia data to reconstruct the history of the Milky Way."
  role: "Astrophysicist building machine-learning methods for large surveys"
  bio: "I am a fifth-year PhD candidate at the University of Porto and IA, building machine learning for Galactic archaeology. Deep neural networks and unsupervised learning on <i>Gaia</i> and other large surveys let me reconstruct how the Milky Way was assembled. My first-author paper in <i>Astronomy and Astrophysics</i> (2025) led to Starfold, an open-source Python package."
  bio_2: "I am principal investigator on two competitive supercomputing allocations, on Deucalion and MareNostrum 5, for JANUS, my neural network for <i>Gaia</i> spectra. I also use Bayesian inference and asteroseismology to measure stellar ages."
  facts:
