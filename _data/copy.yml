research:
  description: "Research by Andreas W. Neitzel: machine learning, Gaia spectra and stellar oscillations to trace the history of the Milky Way."
  lede: "I chain neural networks, clustering methods and stellar oscillations to turn <i>Gaia</i> spectra into the chemistry, ages and populations that record how the Milky Way was assembled."
  fig_line: "From <i>Gaia</i> spectra to the history of the Milky Way"
  lines:
    - id: "janus"
      kicker: "2025 to 2027 · PhD work within ArqueoGal"
      title: "JANUS: chemistry from <i>Gaia</i> spectra"
      text: "<i>Gaia</i> DR3 holds low-resolution spectra of 220 million stars. JANUS, eight normalising-flow networks (a type of neural network), reads a red giant's parameters and chemical abundances from them and gives each star a probability that those parameters are unreliable. I trained it on stars that <i>Gaia</i> shares with the APOGEE survey and checked it on open clusters and wide binaries."
    - id: "arqueogal"
      kicker: "2026 to 2027 · FCT project 2024.15303.PEX · PI T. L. Campante"
      title: "ArqueoGal: the project the pipelines serve"
      text: "ArqueoGal is an FCT exploratory project on the Milky Way's history, led by Tiago L. Campante. I am a co-investigator and team member, and I develop its machine-learning pipelines: JANUS for stellar properties, Starfold for populations, and a repository that prepares <i>Gaia</i> DR3 and APOGEE DR19 data with provenance. The two FCT computing allocations run that work."
    - id: "populations"
      kicker: "2023 to now · 2025 paper and Starfold"
      title: "Stellar populations without labels"
      text: "My 2025 paper in <i>Astronomy and Astrophysics</i> tests a method for sorting stars into populations on a simulated galaxy, and shows where realistic measurement errors break it. Starfold, open source, grew out of it: it picks its own settings, refits to test stability and raises named warnings. On four held-out tables it matched or beat the library defaults on two and lost on two."
    - id: "seismology"
      kicker: "2021 to now · TESS, <i>Kepler</i> and ESPRESSO"
      title: "Asteroseismology: ages from stellar oscillations"
      text: "Stars oscillate, and the pattern tells their age. My MSc dissertation measured how this tightens the ages of Sun-like planet hosts in the <i>Ariel</i> target list. With the ESPRESSO spectrograph at the Very Large Telescope I observed on the campaign that detected oscillations in GJ 570 A, and I contributed to <i>Ariel</i> stellar characterisation and to the ε Indi detection. TESS and <i>Kepler</i> data supply the ages."
    - id: "hpc"
      kicker: "2025 to now · Deucalion and MareNostrum 5"
      title: "Supercomputers: where the networks train"
      text: "Two FCT advanced-computing projects, with me as principal investigator. On Deucalion, 299,520 ARM core-hours (one processor core running for an hour) and 1,500 A100 GPU-hours run JANUS on the <i>Gaia</i> DR3 spectra of about 220 million stars. On MareNostrum 5, 1,002,400 core-hours and 1,000 H100 GPU-hours are for <i>Gaia</i> DR4. Before them I used 94,001 core-hours of development access on Deucalion."
    - id: "paranal"
      kicker: "May 2024 · ESO Very Large Telescope, Paranal"
      title: "Six nights at Paranal"
      text: "As visiting astronomer I carried out the ESPRESSO observations of GJ 570 A, a nearby star somewhat cooler than the Sun. Over five usable nights, from six allocated, we took 2,369 spectra, of which 2,250 gave usable velocity measurements, and the star's oscillations emerged from them. The paper is now published in Astronomy and Astrophysics."
    - id: "haydn"
      kicker: "2025 to 2026 · INAF-OAS Bologna"
      title: "HAYDNsim: noise forecasts for crowded clusters"
      text: "HAYDN is a proposed ESA mission to study stellar oscillations in dense star clusters. During a six-month secondment in Bologna I wrote HAYDNsim, which builds a synthetic cluster field, runs it through the mission's noise estimator on Deucalion, and returns the noise and the share of borrowed light for every star. I presented a poster at TASC10/KASC17; the paper is in preparation."
  explainers_lead: "Each of my papers explained for readers outside astronomy, with what was found and what I did."
  janus_fig:
    default: "Seven stages from <i>Gaia</i> spectra to a catalogue. Hover a stage."
    aria: "Schematic of the JANUS pipeline in seven stages: <i>Gaia</i> XP spectra and APOGEE DR19 labels feed an ensemble of eight normalising flows, which outputs labelled stars with uncertainties and a reliability probability, collected into a TESS red-giant catalogue and run on two supercomputers."
    stages:
      gaia: {title: "<i>Gaia</i>", line: "The <i>Gaia</i> spacecraft; DR3 holds XP spectra of about 220 million stars."}
      xp: {title: "XP spectrum", line: "One red giant's blue and red spectrum, with Hα and the calcium triplet marked."}
      apogee: {title: "APOGEE DR19", line: "High-resolution survey labels for training, showing the two α sequences of the disc."}
      janus: {title: "JANUS", line: "Eight conditional flows turn a Gaussian into each star's label distribution."}
      labels: {title: "Labels", line: "Temperature, gravity, [M/H] and [α/M] with spreads, plus P(H) to select trustworthy stars."}
      catalogue: {title: "Catalogue", line: "Labels for TESS red giants with oscillations, the chemistry layer of ArqueoGal."}
      hpc: {title: "Supercomputers", line: "Deucalion runs DR3 and MareNostrum 5 runs DR4, on FCT allocations I lead."}
  guide_line: "The field guide explains the science, institutions and machines behind this work, one minute each."

software:
  description: "Research software, browser apps and interactive demos by Andreas W. Neitzel: JANUS, Starfold, HAYDNsim and more."
  lede: "I write research software for stellar astrophysics and build browser apps that let you run the methods on real data."
  codes_title: "Research codes"
  codes:
    - id: "janus"
      kicker: "PhD work, 2025 to 2027"
      text: "Neural networks that read a red giant's chemistry from its <i>Gaia</i> spectrum and say how far to trust each result. It runs on Deucalion and MareNostrum 5."
    - id: "starfold"
      kicker: "Open source · version 0.2.0 · MIT licence"
      text: "Python package that finds groups in a table of measurements without labels and reports how often each group recurs across 32 refits. It returns 17 named warnings for claims the evidence does not support."
    - id: "haydnsim"
      kicker: "2025 to 2026 · paper in preparation"
      text: "Pipeline that builds synthetic fields of dense star clusters and forecasts the noise in each star's brightness measurement for the proposed HAYDN mission. I wrote it during my secondment at INAF-OAS Bologna."
  playgrounds_lead: "Methods from my coursework and research, rebuilt to run in the browser on real data."
  playgrounds:
    - id: "nn"
      title: "Train a neural network on <i>Gaia</i> spectra"
      text: "Watch a network learn stellar metallicity live from real spectra of 4,000 stars."
    - id: "orbits"
      title: "Orbits, from satellites to the Milky Way"
      text: "Compare three ways of integrating an orbit around the Earth, then follow six <i>Gaia</i> stars through the Galaxy."
    - id: "gp"
      title: "Gaussian processes on a star's velocities"
      text: "Draw random curves, pin them to observations, then model the activity of the star HD 41248 from 223 velocity measurements."
    - id: "polytropes"
      title: "Build a star"
      text: "Solve the Lane-Emden equation, scale it to a real star and see where the simple model stops working."
  demos_lead: "Larger tools built on real catalogues and stellar models, to explore in the browser."
  demos:
    - id: "starfold-demo"
      title: "Starfold on 9,242 Milky Way stars"
      text: "Inspect any star's APOGEE chemistry and <i>Gaia</i> orbit, and replay the 32 refits."
    - id: "stellar-explorer"
      title: "Stellar Explorer"
      text: "Follow a star of one solar mass from birth to white dwarf, from a MESA and GYRE model."
    - id: "haydnsim"
      title: "HAYDNsim"
      text: "Synthetic crowded clusters and per-star noise forecasts for the proposed HAYDN mission."
    - id: "tellurion"
      title: "Tellurion"
      text: "My separate website of interactive physics and astronomy simulations, written as a teaching resource."
  packages_title: "Packages and applications"

