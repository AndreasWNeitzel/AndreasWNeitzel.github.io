visualisations:
  description: "Renders, animations, figures, dashboards and simulations by Andreas W. Neitzel, made from real data for his research, software and website."
  title: "Visualisations"
  line: "I made these renders, figures and dashboards for my research, my software and this site."
  header_alt: "A looping video shows a pencil sketch of a star's interior becoming a flat schematic, then a 3D cut-away sphere with red and blue oscillation modes, and finally a rendered star with a glowing cut-away interior."
  intro: "Where a picture shows data, the data are real measurements, and the script behind each render states which parts are schematic. I compared the spacecraft part by part with flight photographs and agency images. Hover or tap a piece for its title and a line about it."
  sections:
    - id: "craft"
      title: "Spacecraft"
      intro: "Gaia, Kepler and TESS supply data for my work, and I contribute to PLATO and Ariel. TESS is built on NASA's official base mesh, and I built Kepler to the dimensions of NASA's mesh, 4.7 m high. I found no official model of PLATO or Ariel, so both are schematics from public ESA material, as is Gaia."
    - id: "stars"
      title: "Stars and the Galaxy"
      intro: "The oscillations of one red giant sit at one end of this section and a map of 160,000 Gaia DR3 giants at the other. The power spectrum is that of KIC 6144777 from twelve quarters of Kepler data, and colour in the sky map marks metallicity. The cluster in the line-of-sight drawing is schematic."
    - id: "data"
      title: "Machine learning and computing"
      intro: "Starfold and JANUS account for three of the four pieces here. The dashboard shows 9,242 stars of the real APOGEE run, and the unrolled map 4,000 of them. The JANUS picture starts from a real Gaia XP spectrum, and its later layers are schematic. The machine hall is a schematic of the kind of hall that houses Deucalion and MareNostrum 5."
    - id: "tools"
      title: "Interactive tools"
      intro: "Stellar Explorer runs in the browser, decodes its data file there and uploads nothing. The four playgrounds rebuild methods from my coursework and research on real data. Tellurion is a public beta of physics and astronomy simulations, and the globe draws my research travel from Porto."
  tiles:
    - id: "pipeline"
      title: "The research circuit"
      line: "One loop takes Kepler and Gaia data through JANUS and Starfold to the Milky Way, drawn from the real measurements."
      alt: "The research pipeline rendered as a scene, from Gaia to the Milky Way"
    - id: "gaia"
      title: "Gaia"
      line: "A turntable of the spacecraft, modelled from ESA's published descriptions of its sunshield, service module and payload."
      alt: "The Gaia spacecraft turning slowly against the Milky Way"
    - id: "tellurion"
      title: "Tellurion"
      line: "Interactive physics simulations in the browser, here a black hole with its photon sphere and innermost stable orbit marked."
      alt: "The black-hole page of Tellurion: a lensed accretion disc around the shadow of a black hole, with the photon sphere and the innermost stable orbit marked."
    - id: "hall"
      title: "The machine hall"
      line: "A schematic of the kind of hall that houses Deucalion and MareNostrum 5, with racks, raised floor and cable trays."
      alt: "A cold aisle of server racks with status lights blinking"
    - id: "starfold"
      title: "The Starfold dashboard"
      line: "Linked panels for 9,242 APOGEE DR19 stars: select on the map and the chemistry, orbits and refits follow."
      alt: "The Starfold dashboard: run summary, the map of the stars in two groups, the chemistry and orbit planes, the refits and one star's record"
    - id: "plato"
      title: "PLATO"
      line: "Built to ESA's published figures: 26 cameras in four groups of six and two fast, on a bench about 9 m across."
      alt: "Schematic render of the PLATO spacecraft: its 26 cameras in groups on a bench above a gold-wrapped service module, with a sunshield."
    - id: "seismo"
      title: "A red giant's oscillations"
      line: "The Kepler power spectrum of KIC 6144777 from twelve quarters of data, drawn as filaments with its shape unchanged."
      alt: "A Kepler power spectrum of a red giant drawn as filaments of light"
    - id: "janus"
      title: "JANUS"
      line: "A real Gaia XP spectrum of a red giant passes through a network, and the network is drawn as a schematic."
      alt: "Light passing forward and back through the layers of a neural network"
    - id: "unroll"
      title: "Starfold, unrolled"
      line: "4,000 real stars of the run leave the chemistry plane, settle on a rolled sheet and unroll into the map with its two groups."
      alt: "A sheet of real stars from the Starfold run unrolls, and two groups appear as it flattens"
    - id: "ariel"
      title: "Ariel"
      line: "Built from ESA images with three V-groove shells and an elliptical primary of 1.1 by 0.7 m."
      alt: "Schematic render of Ariel: an off-axis telescope in a curved baffle above three stacked radiator shields and a gold-wrapped service module."
    - id: "explorer"
      title: "Stellar Explorer"
      line: "Follows a star of one solar mass from contraction to white dwarf, using 94 models with their own interiors."
      alt: "The Stellar Explorer card: a star's evolutionary track drawn as a line of light, with the star at its current point"
    - id: "field"
      title: "One line of sight through a cluster"
      line: "An isometric drawing generated by script that shows how neighbouring stars add light to a target's pixel mask."
      alt: "An isometric drawing of a globular cluster, the column of sky through it, the detector and the pixel mask of one target star"
