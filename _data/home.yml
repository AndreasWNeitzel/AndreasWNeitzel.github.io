# Curated home-page content. Every fact here restates an entry of the public ledger export
# (_data/ledger.yml) or a public record linked from it; the ledger id is given for each item.

profile:
  role: PhD researcher in astrophysics and machine learning
  institute: IA and University of Porto
  nouns: [Astronomer, Machine learning, Neural networks, Galactic archaeology, Gaia, Asteroseismology, HPC]
  descriptor: >-
    I build neural networks and unsupervised methods that read stellar chemistry, ages and
    populations from <i>Gaia</i> spectra and asteroseismic data, and I run them on European
    supercomputers.

glance:
  - {n: "4", label: refereed papers}
  - {n: "16", label: talks and posters}
  - {n: "1.3 M", label: core-hours approved}
  - {n: "5", label: fellowships and allocations}

# Four pieces of work, one card each; the rest of the record is on the Research page.
selected:
  - title: Stellar populations without labels, from the paper to Starfold
    kicker: A&A 695, A243 (2025), first author · Starfold 0.2.0, open source
    text: Manifold learning separates disc, halo and accreted stars in a simulated Milky Way; Starfold is the package that grew out of it, with 17 named warnings.
    url: /research/#populations
    img: /assets/img/cards/milky-way.webp
    tag: paper
    label: paper and software
    ledger: [pub-2025-neitzel-manifold-learning, sw-2026-starfold]
  - title: JANUS, the chemistry of red giants from Gaia spectra
    kicker: PhD work within the FCT project ArqueoGal, 2025 to 2027
    text: Normalising-flow networks that read stellar parameters and chemistry from Gaia spectra, with a reliability score for every star.
    url: /research/#janus
    art: nn
    tag: software
    label: research
    ledger: [fund-2026-arqueogal-pex-participant, pres-2026-07-tasc10-oral-janus, pres-2026-10-imas13-oral-janus]
  - title: ArqueoGal, the Milky Way's history with Galactic archaeology
    kicker: FCT exploratory project, 2026 to 2027, co-investigator
    text: The project JANUS and Starfold serve. I develop its machine-learning pipelines and the repository that prepares Gaia DR3 and APOGEE DR19 data with provenance.
    url: /research/#arqueogal
    art: clusters
    tag: grant
    label: project
    ledger: [fund-2026-arqueogal-pex-participant, sw-2026-arqueogal-repo]
  - title: HAYDNsim, noise forecasts for crowded clusters
    kicker: INAF Bologna secondment, 2025 to 2026
    text: Builds synthetic fields of dense star clusters and forecasts each star's photometric noise for the proposed HAYDN mission.
    url: /software/haydnsim/
    img: /assets/img/guide/haydn.webp
    tag: software
    label: pipeline
    ledger: pos-2025-visiting-inaf-bologna

