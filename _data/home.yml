# Structure of the home page: which loop, image, logo and link each card carries. The words are in
# _data/copy.yml; every fact restates an entry of the public ledger export (_data/ledger.yml).

# Four concept cards under the hero, one looping render each (assets/video, posters in assets/img/heroes).
concepts:
  - key: missions
    loop: gaia
    url: /guide/gaia/
  - key: ai
    loop: ai
    url: /research/janus/
  - key: hpc
    loop: hall
    url: /guide/supercomputers/
  - key: sky
    loop: sky
    url: /guide/galactic-archaeology/

# Three wide portals. Photographs are mine or show me; the renders are built from real data or real
# geometry (figures/heroes, scripts under figures/).
portals:
  - key: research
    url: /research/
    images:
      - {src: /assets/img/heroes/research_seismo.webp, pos: "62% 50%"}
      - {src: /assets/img/photos/ut-frame.webp, pos: "50% 50%"}
      - {src: /assets/img/heroes/research_allsky.webp, pos: "50% 50%"}
  - key: software
    url: /software/
    images:
      - {src: /assets/img/heroes/line_janus.webp, pos: "50% 50%", loop: ai}
      - {src: /assets/img/heroes/software_starfold.webp, pos: "42% 50%", loop: starfold}
      - {src: /assets/img/heroes/software_haydn.webp, pos: "100% 45%", loop: haydn}
  - key: talks
    url: /talks/
    images:
      - {src: /assets/img/heroes/talk_aarhus.webp, pos: "30% 55%"}
      - {src: /assets/img/heroes/talk_porto.webp, pos: "62% 50%"}
      - {src: /assets/img/heroes/talk_dfa_wide.webp, pos: "84% 50%"}

# Missions and machines: official marks where the agency's terms allow (assets/img/logos/policy.md),
# line marks otherwise.
missions:
  - id: gaia
    logo: /assets/img/logos/missions/gaia-112.webp
    logo_alt: Gaia mission logo (ESA)
    url: /guide/gaia/
  - id: kepler
    logo: /assets/img/logos/missions/kepler-112.webp
    logo_alt: Kepler mission logo (NASA)
    wide: true
    url: /guide/tess-kepler/
  - id: tess
    logo: /assets/img/logos/missions/tess-112.webp
    logo_alt: TESS mission logo (NASA)
    url: /guide/tess-kepler/
  - id: plato
    logo: /assets/img/logos/missions/plato-112.webp
    logo_alt: PLATO mission logo (ESA)
    url: /guide/plato/
  - id: ariel
    logo: /assets/img/logos/missions/ariel-112.webp
    logo_alt: Ariel mission logo (ESA)
    url: /guide/ariel/
  - id: haydn
    logo: /assets/img/logos/missions/haydn-112.webp
    logo_alt: HAYDN mission logo
    url: /guide/haydn/
  - id: vlt
    icon: i-telescope
    url: /observing/paranal/
  - id: deucalion
    icon: i-cpu
    url: /guide/supercomputers/
  - id: marenostrum
    icon: i-cpu
    url: /guide/supercomputers/

missions_credit: "Logos: ESA (Gaia, PLATO, Ariel), NASA (Kepler, TESS), HAYDN proposal consortium."

# Photographs for the About page strip (assets/img/heroes), captions in copy.yml.
strip:
  - {key: golden, src: /assets/img/photos/vlt-golden-hour.webp, pos: "50% 50%"}
  - {key: dome, src: /assets/img/photos/ut-under-mirror-cell.webp, pos: "50% 60%"}
  - {key: aarhus, src: /assets/img/heroes/talk_aarhus.webp, pos: "30% 60%"}
  - {key: daylight, src: /assets/img/photos/vlt-daylight.webp, pos: "50% 50%"}
  - {key: porto, src: /assets/img/heroes/talk_porto.webp, pos: "62% 55%"}

# Guide articles that open with a loop instead of their photograph (the loop's name under assets/video).
guide_loops:
  gaia: gaia
  supercomputers: hall
  haydn: cluster
  machine-learning-for-stars: ai
  galactic-archaeology: sky
# Sources printed on a guide loop built on someone else's material.
guide_loop_credits:
  tess-kepler: "Base meshes NASA 3D Resources; sky ESO/S. Brunier, CC BY 4.0"
  plato: "Sky ESO/S. Brunier, CC BY 4.0"
  ariel: "Sky ESO/S. Brunier, CC BY 4.0"
# a guide page whose plate shows the same render as its card on /guide/ (stills; loops are in guide_loops)
guide_stills:
  asteroseismology: /assets/img/heroes/research_seismo.webp
guide_still_alts:
  asteroseismology: "A Kepler power spectrum of a red giant drawn as filaments of light"
