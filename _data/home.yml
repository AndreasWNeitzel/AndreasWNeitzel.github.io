# Curated home-page content. Every fact here restates an entry of the public ledger export
# (_data/ledger.yml) or a public record linked from it; the ledger id is given for each item.

profile:
  role: PhD researcher in astrophysics and machine learning
  institute: IA and University of Porto
  nouns: [Astronomer, Machine learning, Neural networks, Galactic archaeology, Gaia, Asteroseismology, HPC]
  descriptor: >-
    I build neural networks and unsupervised methods that read stellar chemistry, ages and
    populations from <i>Gaia</i> spectra and asteroseismic data, and I run them on European
    supercomputers.
  facts:
    - Porto, Portugal
    - EU citizen (Portugal, Germany)
    - Portuguese, English (C2), German (A2), Spanish (A2)

glance:
  - {n: "4", label: refereed papers}
  - {n: "16", label: talks and posters}
  - {n: "1.3 M", label: core-hours approved}
  - {n: "5", label: fellowships and allocations}

highlights:
  - tag: paper
    label: paper
    title: First-author paper in A&A
    text: A manifold-learning method that separates the Milky Way's stellar populations, tested on a simulated galaxy.
    when: "2025"
    url: /papers/neitzel-2025-manifold-learning/
    ledger: pub-2025-neitzel-manifold-learning
  - tag: hpc
    label: HPC
    title: 1.3 million core-hours approved
    text: Responsible investigator on two FCT computing projects, on MareNostrum 5 and Deucalion, with 2,500 GPU-hours.
    when: "2026"
    url: /guide/supercomputers/
    ledger: [fund-2026-10-cpca-a2-marenostrum, fund-2026-10-cpca-a1-deucalion]
  - tag: observing
    label: observing
    title: ESO Very Large Telescope
    text: Visiting astronomer at Paranal for the ESPRESSO campaign on GJ 570 A, now published in A&A.
    when: "2024"
    url: /observing/paranal/
    thumb: /assets/img/photos/vlt-golden-hour.webp
    ledger: ev-2024-05-paranal-espresso-observing-run
  - tag: grant
    label: funding
    title: Three fellowships won
    text: FCT doctoral fellowship, ArqueoGal PhD fellowship and an FCT MSc grant; co-investigator on the FCT project ArqueoGal.
    when: 2021 to 2027
    url: /cv/#funding
    ledger: [fund-2025-09-fct-doctoral-fellowship, fund-2026-09-arqueogal-bi-d-fellowship, fund-2021-fct-msc-research-grant, fund-2026-arqueogal-pex-participant]
  - tag: abroad
    label: abroad
    title: INAF Bologna secondment
    text: Six months building noise simulations for the proposed <i>HAYDN</i> mission, with visits to INAF Padova.
    when: 2025/26
    url: /guide/inaf/
    ledger: pos-2025-visiting-inaf-bologna
  - tag: talk
    label: talks
    title: Four international talks
    text: TASC10/KASC17 in Aarhus (talk and poster), IMAS13 and IMAS11 in Spain, TASC8/KASC15 in Porto.
    when: 2024 to 2026
    url: /talks/
    ledger: [pres-2026-07-tasc10-oral-janus, pres-2026-07-tasc10-poster-haydnsim, pres-2026-10-imas13-oral-janus, pres-2024-11-imas11-oral, pres-2024-07-tasc8-oral]

