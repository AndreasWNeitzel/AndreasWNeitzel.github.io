---
layout: default
---
<div class="wrap">
  <header class="page-head">
    {%- if page.crumb %}<p class="crumbs"><a href="{{ page.crumb.url | relative_url }}">{{ page.crumb.label }}</a></p>{% endif %}
    <h1>{{ page.title | missions }}</h1>
    {%- if page.lede %}
    <p class="lede">{{ page.lede | missions }}</p>
    {%- endif %}
  </header>
  {{ content }}
</div>
