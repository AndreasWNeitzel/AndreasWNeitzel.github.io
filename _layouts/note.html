---
layout: default
---
<article class="row">
  <p class="when aside"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y-%m-%d' }}</time></p>
  <h1>{{ page.title }}</h1>
  {%- if page.lede %}
  <p class="prose lede">{{ page.lede }}</p>
  {%- endif %}
  <div class="prose">
  {{ content }}
  </div>
</article>
