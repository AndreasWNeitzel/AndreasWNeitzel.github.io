# Site
title: Andreas W. Neitzel
description: >-
  PhD candidate in astronomy at IA/CAUP, University of Porto. Machine-learning methods for
  Galactic archaeology with Gaia spectra and asteroseismic data.
url: https://andreaswneitzel.github.io
baseurl: ""
lang: en
author:
  name: Andreas W. Neitzel
  email: andreaswneitzel@gmail.com
og_image: /assets/img/portrait_square.jpg
og_image_width: 903
og_image_height: 903

# Build
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols:
    ndash: "-"
    mdash: ", "
permalink: pretty
timezone: Europe/Lisbon
strict_front_matter: true
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - scripts
  - _local
  - .prettierrc
  - .prettierignore
  - .pre-commit-config.yaml
  - .lycheeignore
include:
  - _pages
  - llms.txt
keep_files:
  - .nojekyll

plugins:
  - jekyll/scholar
  - jekyll-feed
  - jekyll-sitemap

collections:
  notes:
    output: true
    permalink: /notes/:title/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: notes
    values:
      layout: note

feed:
  collections:
    - notes

# jekyll-scholar
scholar:
  style: apa
  locale: en
  source: _bibliography
  bibliography: papers.bib
  bibliography_template: bib
  sort_by: year,month
  order: descending
  group_by: none
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
  query: "@*"
