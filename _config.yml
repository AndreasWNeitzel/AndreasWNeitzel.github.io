# Site
title: Andreas W. Neitzel
description: >-
  PhD researcher in astrophysics and machine learning at IA and the University of Porto: neural
  networks for Gaia spectra, asteroseismology, Galactic archaeology and HPC.
url: https://andreaswneitzel.github.io
baseurl: ""
lang: en
author:
  name: Andreas W. Neitzel
  email: andreaswneitzel@gmail.com
og_image: /assets/img/og-vlt.jpg
og_image_alt: Andreas W. Neitzel on the platform of ESO's Very Large Telescope at Paranal at sunset

# Build
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols:
    ndash: "-"
    mdash: ", "
permalink: pretty
timezone: Europe/Lisbon
strict_front_matter: true
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - scripts
  - figures
  - _local
  - .prettierrc
  - .prettierignore
  - .pre-commit-config.yaml
  - .lycheeignore
include:
  - _pages
  - llms.txt
keep_files:
  - .nojekyll

plugins:
  - jekyll/scholar
  - jekyll-feed
  - jekyll-sitemap

collections:
  notes:
    output: true
    permalink: /notes/:title/
  guide:
    output: true
    permalink: /guide/:name/
  papers:
    output: true
    permalink: /papers/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: notes
    values:
      layout: note
  - scope:
      path: ""
      type: guide
    values:
      layout: guide
  - scope:
      path: ""
      type: papers
    values:
      layout: paper

feed:
  collections:
    - notes

# jekyll-scholar
scholar:
  style: apa
  locale: en
  source: _bibliography
  bibliography: papers.bib
  bibliography_template: bib
  sort_by: year,month
  order: descending
  group_by: none
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
  query: "@*"
